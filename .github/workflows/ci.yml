name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trackside
          POSTGRES_PASSWORD: trackside
          POSTGRES_DB: trackside_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackside"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        env:
          TEST_DATABASE_URL: postgres://trackside:trackside@localhost:5432/trackside_test?sslmode=disable
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t trackside:ci .
