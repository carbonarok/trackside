services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackside
      POSTGRES_PASSWORD: trackside
      POSTGRES_DB: trackside
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackside"]
      interval: 5s
      retries: 10

  trackside:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Every setting in .env reaches the server: feed credentials, inbox,
    # APNs and API_KEY alike. The two below win over .env, so the database
    # and the port mapping stay right.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://trackside:trackside@db:5432/trackside?sslmode=disable
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
