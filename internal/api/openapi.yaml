openapi: 3.1.0
info:
  title: trackside
  version: "0.1"
  summary: Open UK train times from public rail data feeds.
  description: |
    Timetable, live running and forecasts for Great Britain's railway, built
    from Network Rail and National Rail (Darwin) open data.

    All times are UK local time in RFC 3339 format, for example
    `2026-10-06T08:07:00+01:00`. Locations are given by CRS code (`CLJ`) or
    TIPLOC (`CLPHMJN`); a CRS covers every TIPLOC at the station.

    Contains public sector information licensed under the Open Government
    Licence v3.0. Darwin data powered by National Rail Enquiries.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

paths:
  /v1/locations:
    get:
      summary: Search locations
      operationId: searchLocations
      parameters:
        - name: q
          in: query
          required: true
          description: Name, CRS or TIPLOC; at least 2 characters.
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: Matching locations, stations first.
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/locations/{code}:
    get:
      summary: Get a location and its TIPLOCs
      operationId: getLocation
      parameters:
        - $ref: "#/components/parameters/LocationCode"
      responses:
        "200":
          description: The location.
          content:
            application/json:
              schema:
                type: object
                required: [location, tiplocs]
                properties:
                  location: { $ref: "#/components/schemas/Location" }
                  tiplocs:
                    type: array
                    items: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/locations/{code}/departures:
    get:
      summary: Departure board
      operationId: getDepartures
      parameters:
        - $ref: "#/components/parameters/LocationCode"
        - $ref: "#/components/parameters/At"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/Passes"
        - name: to
          in: query
          description: Only trains that call at this location later (CRS or TIPLOC).
          schema: { type: string }
      responses:
        "200":
          description: Trains departing in the window, in time order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/locations/{code}/arrivals:
    get:
      summary: Arrivals board
      operationId: getArrivals
      parameters:
        - $ref: "#/components/parameters/LocationCode"
        - $ref: "#/components/parameters/At"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/Passes"
        - name: from
          in: query
          description: Only trains that called at this location earlier (CRS or TIPLOC).
          schema: { type: string }
      responses:
        "200":
          description: Trains arriving in the window, in time order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/locations/{code}/messages:
    get:
      summary: Station messages
      operationId: getStationMessages
      parameters:
        - $ref: "#/components/parameters/LocationCode"
      responses:
        "200":
          description: Darwin station messages, most severe first.
          content:
            application/json:
              schema:
                type: object
                required: [location, messages]
                properties:
                  location: { $ref: "#/components/schemas/Location" }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/services:
    get:
      summary: Find trains by headcode or UID
      operationId: searchServices
      parameters:
        - { name: q, in: query, required: true, description: "Headcode (e.g. 2P47) or train UID.", schema: { type: string, minLength: 2 } }
        - { name: date, in: query, description: Run date; defaults to today., schema: { type: string, format: date } }
      responses:
        "200":
          description: Matching trains in departure order (at most 50).
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/services/{uid}/{date}:
    get:
      summary: Service detail
      description: A train's full route with live times, position and associations.
      operationId: getService
      parameters:
        - name: uid
          in: path
          required: true
          description: Train UID, e.g. W10001.
          schema: { type: string }
        - name: date
          in: path
          required: true
          description: Run date (the date the train starts).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/delay-repay:
    get:
      summary: Check a journey for Delay Repay
      description: |
        Works out how late a passenger reached their destination, measured
        against the booked arrival as the national Delay Repay scheme does.
        If the booked train was cancelled, the next train that ran between
        the two stations is used. Works for today's trains as well as
        archived ones.
      operationId: checkDelayRepay
      parameters:
        - { name: from, in: query, required: true, description: Departure station (CRS or TIPLOC)., schema: { type: string } }
        - { name: to, in: query, required: true, description: Destination station (CRS or TIPLOC)., schema: { type: string } }
        - { name: date, in: query, required: true, description: Travel date., schema: { type: string, format: date } }
        - { name: departure, in: query, required: true, description: Booked departure time (HH:MM)., schema: { type: string, example: "08:07" } }
      responses:
        "200":
          description: The claim assessment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelayRepay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/history/services/{uid}:
    get:
      summary: A train's recent running
      operationId: getServiceHistory
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, description: How many days back., schema: { type: integer, minimum: 1, maximum: 400, default: 30 } }
      responses:
        "200":
          description: Archived runs, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/stats/locations/{code}:
    get:
      summary: Station punctuality
      operationId: getStationStats
      parameters:
        - $ref: "#/components/parameters/LocationCode"
        - { name: days, in: query, description: How many days back., schema: { type: integer, minimum: 1, maximum: 400, default: 7 } }
      responses:
        "200":
          description: Punctuality over the period, from archived history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/map/trains:
    get:
      summary: Live train positions (GeoJSON)
      description: |
        Where every running train is estimated to be, as a GeoJSON
        FeatureCollection. Trains standing at a station are placed there;
        otherwise along the straight line between the stations either side,
        in proportion to the time between them (actual, forecast or booked
        times, in that order). Cached for 15 seconds. A map is served at /map.
      operationId: getTrainMap
      parameters:
        - { name: all, in: query, description: Include freight and empty stock., schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Train positions.
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/TrainMap" }

  /v1/map/stations:
    get:
      summary: Stations (GeoJSON)
      operationId: getStationMap
      responses:
        "200":
          description: Every station with coordinates.
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/StationMap" }

  /v1/live:
    get:
      summary: Live change notifications (WebSocket)
      operationId: live
      description: |
        Upgrade to a WebSocket to hear when boards, trains and the map change,
        then refetch them with the endpoints above. Messages are JSON text
        frames and carry topics, not data.

        Send `{"type":"subscribe","topics":[…]}` or
        `{"type":"unsubscribe","topics":[…]}`, up to 64 topics a connection:

        - `station:<CRS or TIPLOC>`: that station's boards or messages may have changed
        - `train:<uid>|<YYYY-MM-DD>`: that service may have changed
        - `map`: train positions may have moved

        The server sends `{"type":"hello","fallback":120}` first. Keep polling
        every `fallback` seconds anyway: boards built on demand from Darwin
        Lite are never pushed. Then `{"type":"changed","topics":[…]}` lists
        the subscribed topics that changed, at most every 2 seconds, and
        `{"type":"error","message":"…"}` reports bad input without closing
        the connection. A client that falls far behind is disconnected and
        should reconnect and refetch. Browser pages from other sites are
        refused; clients that send no Origin header are accepted.
      responses:
        "101":
          description: Switched to the WebSocket protocol.
        "403":
          description: The request came from another site's page.

  /v1/activities/register:
    post:
      summary: Register an iOS Live Activity for pushes
      operationId: registerActivity
      description: |
        Starts APNs pushes to a Live Activity following one leg of a journey.
        Registering the same `activity_id` again replaces its token. Answers
        503 when the server has no APNs key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token, activity_id, service_uid, run_date, origin_crs, destination_crs, bundle_id]
              properties:
                push_token: { type: string, description: The ActivityKit push token, hex-encoded. }
                activity_id: { type: string, maxLength: 128 }
                service_uid: { type: string, examples: [W12345] }
                run_date: { type: string, format: date }
                origin_crs: { type: string, pattern: "^[A-Z]{3}$" }
                destination_crs: { type: string, pattern: "^[A-Z]{3}$" }
                bundle_id: { type: string, examples: [com.example.TrackSideIOS] }
                connection_minutes: { type: integer, minimum: 0, description: Minutes to make this train from the previous leg. }
                phase: { type: string, enum: [upcoming, boarding, onTrain, arrived], description: The phase the app is showing. }
                previous_service_uid: { type: string, description: "The previous leg's train. The connection is then worked out from both trains' live times, and a change to either updates this activity." }
                previous_run_date: { type: string, format: date, description: Defaults to run_date. }
                previous_arrival_crs: { type: string, pattern: "^[A-Z]{3}$", description: Where the previous train is left. Defaults to origin_crs; set it for a change of station. }
                device_token: { type: string, description: "The device's own APNs token, hex-encoded. With it, platform changes, cancellations and delays also arrive as a normal notification, with their text in Notification Center." }
      responses:
        "201": { description: Registered. }
        "200": { description: Registration updated. }
        "400": { description: The body is not a valid registration. }
        "403": { description: The bundle ID is not one this server pushes to. }
        "404": { description: No such service on that date. }
        "422": { description: "The service doesn't call at the origin and then the destination, or the previous train doesn't call at the connecting station." }
        "503": { description: Pushes are not configured on this server. }

  /v1/activities/{activity_id}:
    delete:
      summary: Stop pushes to a Live Activity
      operationId: deregisterActivity
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed, or was not registered. }

  /healthz:
    get:
      summary: Liveness check
      operationId: health
      responses:
        "200":
          description: The server and its database are up.
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: The database is unavailable.

components:
  parameters:
    LocationCode:
      name: code
      in: path
      required: true
      description: CRS (e.g. CLJ) or TIPLOC (e.g. CLPHMJN).
      schema: { type: string }
    At:
      name: at
      in: query
      description: Start of the window, RFC 3339 or YYYY-MM-DDTHH:MM (UK time). Defaults to now.
      schema: { type: string }
    Window:
      name: window
      in: query
      description: Window length in minutes.
      schema: { type: integer, minimum: 1, maximum: 1440, default: 120 }
    Passes:
      name: passes
      in: query
      description: Include trains passing without stopping.
      schema: { type: boolean, default: false }

  responses:
    BadRequest:
      description: Invalid parameters.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown location or service.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Location:
      type: object
      required: [tiploc, name]
      properties:
        tiploc: { type: string, example: CLPHMJN }
        crs: { type: string, example: CLJ }
        name: { type: string, example: Clapham Junction }

    Operator:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: SW }
        name: { type: string, example: South Western Railway }

    Endpoint:
      description: A service's origin or destination.
      allOf:
        - $ref: "#/components/schemas/Location"
        - type: object
          properties:
            time:
              type: string
              format: date-time
              description: Public departure (origin) or arrival (destination) time, or the working time if not public.

    Times:
      type: object
      description: Planned and live times for one event at a stop.
      properties:
        public: { type: string, format: date-time, description: Timetabled public time. }
        working: { type: string, format: date-time, description: Working timetable time. }
        actual: { type: string, format: date-time, description: Reported by TRUST, Darwin or Train Describer. }
        estimated: { type: string, format: date-time, description: Darwin's forecast, or projected from the latest delay. }
        delayMinutes: { type: integer, description: Actual or estimated time minus the public (else working) time. }
        delayed: { type: boolean, description: Late by an amount not yet known. }
        cancelled: { type: boolean }

    Platform:
      type: object
      required: [changed, confirmed]
      properties:
        planned: { type: string, description: Booked platform from the timetable. }
        actual: { type: string, description: Live platform from Darwin, TRUST or TD. }
        changed: { type: boolean }
        confirmed: { type: boolean }
        suppressed:
          type: boolean
          description: >-
            National Rail isn't showing this platform to passengers yet, usually at a
            big station until it's announced. Darwin's live platform is held back, so
            only the booked platform (and any platform already reported by TRUST or
            TD) is given.

    Stop:
      allOf:
        - $ref: "#/components/schemas/Location"
        - type: object
          required: [kind, cancelled]
          properties:
            kind:
              type: string
              enum: [origin, call, pass, destination, stop]
              description: "`stop` is a call that is not in the public timetable."
            arrival: { $ref: "#/components/schemas/Times" }
            departure: { $ref: "#/components/schemas/Times" }
            pass: { $ref: "#/components/schemas/Times" }
            platform: { $ref: "#/components/schemas/Platform" }
            cancelled: { type: boolean }
            startsHere: { type: boolean, description: First stop served after a change of origin. }
            atPlatform: { type: boolean, description: Arrived and not yet departed. }
            approaching: { type: boolean, description: Train Describer has the train in the berth before this location. }
            terminatesHere: { type: boolean, description: Last stop served after a part cancellation. }
            line: { type: string }
            path: { type: string }

    ServiceSummary:
      type: object
      required: [uid, runDate, isPassenger, status, origin, destination, plannedCancel]
      properties:
        uid: { type: string, example: W10001 }
        runDate: { type: string, format: date }
        headcode: { type: string, example: 1A01 }
        operator: { $ref: "#/components/schemas/Operator" }
        isPassenger: { type: boolean }
        status:
          type: string
          enum: [scheduled, activated, running, terminated, cancelled, partially_cancelled]
        origin:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
        destination:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
        cancelReasonCode: { type: string, description: TRUST delay attribution code, e.g. IA. }
        cancelReasonCodeDescription: { type: string, description: Industry description of cancelReasonCode. }
        cancelReason: { type: string, description: Darwin's passenger-facing cancellation reason. }
        lateReason: { type: string, description: Darwin's passenger-facing delay reason. }
        plannedCancel: { type: boolean, description: Cancelled in the timetable (STP cancellation). }

    BoardService:
      allOf:
        - $ref: "#/components/schemas/ServiceSummary"
        - type: object
          required: [stop]
          properties:
            stop: { $ref: "#/components/schemas/Stop" }

    Message:
      type: object
      required: [id, category, severity, text, html, updatedAt]
      properties:
        id: { type: integer }
        category: { type: string, enum: [Train, Station, Connections, System, Misc, PriorTrains, PriorOther] }
        severity: { type: integer, minimum: 0, maximum: 3, description: 0 information to 3 severe. }
        text: { type: string }
        html: { type: string, description: "Simple HTML: p and a elements only." }
        updatedAt: { type: string, format: date-time }

    Board:
      type: object
      required: [location, from, to, messages, services]
      properties:
        location: { $ref: "#/components/schemas/Location" }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        services:
          type: array
          items: { $ref: "#/components/schemas/BoardService" }

    Position:
      type: object
      description: The last Train Describer berth the train occupied.
      required: [tdArea, berth, at]
      properties:
        tdArea: { type: string }
        berth: { type: string }
        at: { type: string, format: date-time }

    Association:
      type: object
      required: [type, category, location, cancelled, service]
      properties:
        type:
          type: string
          enum: [divides, divided_from, joined_by, joins, forms, formed_from, linked, associated]
          description: The link from this service's point of view.
        category: { type: string, enum: [JJ, VV, NP, LK], description: "JJ join, VV divide, NP next working, LK linked." }
        location: { $ref: "#/components/schemas/Location" }
        cancelled: { type: boolean }
        service: { $ref: "#/components/schemas/ServiceSummary" }

    ServiceDetail:
      allOf:
        - $ref: "#/components/schemas/ServiceSummary"
        - type: object
          required: [source, stops]
          properties:
            trainClass: { type: string }
            powerType: { type: string }
            category: { type: string, description: CIF train category, e.g. OO. }
            source: { type: string, enum: [timetable, vstp] }
            position: { $ref: "#/components/schemas/Position" }
            associations:
              type: array
              items: { $ref: "#/components/schemas/Association" }
            stops:
              type: array
              items: { $ref: "#/components/schemas/Stop" }

    TrainRef:
      type: object
      required: [uid, runDate]
      properties:
        uid: { type: string }
        runDate: { type: string, format: date }
        headcode: { type: string }
        operator: { $ref: "#/components/schemas/Operator" }

    Compensation:
      type: object
      description: Standard Delay Repay 15 refund. Operators set their own schemes; check yours.
      required: [singlePercent, returnPercent]
      properties:
        singlePercent: { type: integer }
        returnPercent: { type: integer }

    DelayRepay:
      type: object
      required: [from, to, bookedDeparture, bookedArrival, train, cancelled, eligible, note]
      properties:
        from: { $ref: "#/components/schemas/Location" }
        to: { $ref: "#/components/schemas/Location" }
        bookedDeparture: { type: string, format: date-time }
        bookedArrival: { type: string, format: date-time }
        train: { $ref: "#/components/schemas/TrainRef" }
        cancelled: { type: boolean }
        cancelReason: { type: string }
        lateReason: { type: string }
        usedTrain:
          $ref: "#/components/schemas/TrainRef"
          description: The train that got the passenger there when the booked one was cancelled.
        actualDeparture: { type: string, format: date-time }
        arrivedAt: { type: string, format: date-time }
        arrivalSource: { type: string, enum: [TRUST, TD, Darwin], description: Feed that reported the arrival. }
        delayMinutes: { type: integer }
        eligible: { type: boolean }
        band: { type: string, enum: ["15-29", "30-59", "60-119", "120+"] }
        compensation: { $ref: "#/components/schemas/Compensation" }
        note: { type: string }

    HistoricCall:
      type: object
      required: [tiploc, cancelled]
      properties:
        tiploc: { type: string }
        crs: { type: string }
        bookedArrival: { type: string, format: date-time }
        bookedDeparture: { type: string, format: date-time }
        actualArrival: { type: string, format: date-time }
        actualDeparture: { type: string, format: date-time }
        delayMinutes: { type: integer }
        cancelled: { type: boolean }

    ServiceRun:
      type: object
      required: [train, origin, destination, cancelled]
      properties:
        train: { $ref: "#/components/schemas/TrainRef" }
        origin: { $ref: "#/components/schemas/HistoricCall" }
        destination: { $ref: "#/components/schemas/HistoricCall" }
        cancelled: { type: boolean }

    ServiceHistory:
      type: object
      required: [uid, days, runs]
      properties:
        uid: { type: string }
        days: { type: integer }
        runs:
          type: array
          items: { $ref: "#/components/schemas/ServiceRun" }

    Punctuality:
      type: object
      required: [booked, reported, cancelled, onTime, within5Minutes, within15Minutes, averageDelayMinutes]
      properties:
        booked: { type: integer }
        reported: { type: integer, description: Calls with an actual time. }
        cancelled: { type: integer }
        onTime: { type: integer, description: Within 59 seconds of the booked time. }
        within5Minutes: { type: integer }
        within15Minutes: { type: integer }
        averageDelayMinutes: { type: number, description: Early counts as zero. }

    LateTrain:
      type: object
      required: [uid, bookedArrival, runs, averageDelayMinutes]
      properties:
        uid: { type: string }
        headcode: { type: string }
        operator: { $ref: "#/components/schemas/Operator" }
        bookedArrival: { type: string, description: HH:MM }
        runs: { type: integer }
        averageDelayMinutes: { type: number }

    StationStats:
      type: object
      required: [location, from, to, arrivals, departures, mostLate]
      properties:
        location: { $ref: "#/components/schemas/Location" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        arrivals: { $ref: "#/components/schemas/Punctuality" }
        departures: { $ref: "#/components/schemas/Punctuality" }
        mostLate:
          type: array
          items: { $ref: "#/components/schemas/LateTrain" }

    PointGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point] }
        coordinates:
          type: array
          description: "[longitude, latitude]"
          minItems: 2
          maxItems: 2
          items: { type: number }

    TrainPosition:
      type: object
      required: [uid, runDate, origin, destination, atStation, bearing, live, isPassenger]
      properties:
        uid: { type: string }
        runDate: { type: string, format: date }
        headcode: { type: string }
        operator: { $ref: "#/components/schemas/Operator" }
        origin: { type: string }
        destination: { type: string }
        last:
          $ref: "#/components/schemas/Location"
          description: The station the train is at or has just left.
        next:
          $ref: "#/components/schemas/Location"
          description: The station the train is heading for.
        atStation: { type: boolean }
        bearing: { type: number, description: Direction of travel in degrees from north. }
        delayMinutes: { type: integer, description: Lateness at the last reported event. }
        live: { type: boolean, description: False when the position comes from the timetable alone. }
        isPassenger: { type: boolean }

    TrainFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        geometry: { $ref: "#/components/schemas/PointGeometry" }
        properties: { $ref: "#/components/schemas/TrainPosition" }

    TrainMap:
      type: object
      required: [type, generatedAt, features]
      properties:
        type: { type: string, enum: [FeatureCollection] }
        generatedAt: { type: string, format: date-time }
        features:
          type: array
          items: { $ref: "#/components/schemas/TrainFeature" }

    StationFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        geometry: { $ref: "#/components/schemas/PointGeometry" }
        properties: { $ref: "#/components/schemas/Location" }

    StationMap:
      type: object
      required: [type, features]
      properties:
        type: { type: string, enum: [FeatureCollection] }
        features:
          type: array
          items: { $ref: "#/components/schemas/StationFeature" }
