<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live train map · trackside</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #ffffff; --fg: #1c1f24; --muted: #69707d; --line: #e3e6eb;
    --ontime: #1f9d55; --late1: #d4a106; --late5: #e8710a; --late15: #d93025; --unknown: #8a9099;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17191d; --fg: #eceef1; --muted: #9aa1ad; --line: #2c3037; }
  }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; z-index: 1000; top: 12px; left: 12px; width: min(320px, calc(100vw - 24px));
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.12);
  }
  .panel h1 { font-size: 15px; margin: 0 0 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .panel input[type=search] {
    width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit;
  }
  .panel label { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--c); vertical-align: -1px; }
  .train svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 1px rgba(0,0,0,.55)); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
  .leaflet-popup-content b { font-size: 14px; }
  .pop-muted { color: #69707d; }
  @media (max-width: 520px) { .legend { display: none; } }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Live train map</h1>
  <div class="sub" id="status">Loading…</div>
  <input type="search" id="filter" placeholder="Headcode, operator or station" aria-label="Filter trains">
  <label><input type="checkbox" id="all"> Include freight and empty stock</label>
  <div class="legend">
    <span style="--c: var(--ontime)">On time</span>
    <span style="--c: var(--late1)">1–4 min late</span>
    <span style="--c: var(--late5)">5–14 min late</span>
    <span style="--c: var(--late15)">15+ min late</span>
    <span style="--c: var(--unknown)">No live report</span>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const map = L.map('map', { zoomControl: false });
// The view lives in the URL (#zoom/lat/lon) so it can be shared.
const view = location.hash.slice(1).split('/').map(Number);
if (view.length === 3 && view.every(Number.isFinite)) {
  map.setView([view[1], view[2]], view[0]);
} else {
  map.fitBounds([[49.9, -6.4], [58.7, 1.8]]);
}
map.on('moveend', () => {
  const c = map.getCenter();
  history.replaceState(null, '', `#${map.getZoom()}/${c.lat.toFixed(4)}/${c.lng.toFixed(4)}`);
});
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer({{.TileURL}}, { maxZoom: 18, attribution: {{.Attribution}} +
  ' · Contains public sector information licensed under the Open Government Licence v3.0 · Powered by National Rail Enquiries' }).addTo(map);

const css = getComputedStyle(document.documentElement);
const colour = name => css.getPropertyValue(name).trim();
function delayColour(p) {
  if (!p.live) return colour('--unknown');
  const d = p.delayMinutes;
  if (d <= 0) return colour('--ontime');
  if (d < 5) return colour('--late1');
  if (d < 15) return colour('--late5');
  return colour('--late15');
}
function icon(p) {
  const c = delayColour(p);
  const shape = p.atStation
    ? `<circle cx="9" cy="9" r="6" fill="${c}" stroke="#fff" stroke-width="2"/>`
    : `<g transform="rotate(${p.bearing} 9 9)"><path d="M9 1 L16 16 L9 12 L2 16 Z" fill="${c}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></g>`;
  // Bigger markers when zoomed in, where there is room for them.
  const z = map.getZoom(), size = z >= 14 ? 28 : z >= 12 ? 22 : z >= 9 ? 18 : 14;
  return L.divIcon({ className: 'train', html: `<svg viewBox="0 0 18 18">${shape}</svg>`,
    iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function popup(p) {
  const delay = !p.live ? 'No live report yet'
    : p.delayMinutes > 0 ? `${p.delayMinutes} min late`
    : p.delayMinutes < 0 ? `${-p.delayMinutes} min early` : 'On time';
  const where = p.atStation && p.last ? `At ${esc(p.last.name)}`
    : p.last && p.next ? `Between ${esc(p.last.name)} and ${esc(p.next.name)}` : '';
  const op = p.operator ? esc(p.operator.name) : 'Unknown operator';
  return `<b>${esc(p.headcode || p.uid)}</b> · ${op}<br>
    ${esc(p.origin)} → ${esc(p.destination)}<br>
    <span class="pop-muted">${where}</span><br>
    <b>${delay}</b><br>
    <a href="/v1/services/${encodeURIComponent(p.uid)}/${p.runDate}" target="_blank" rel="noopener">Service details</a>`;
}

const markers = new Map();
let latest = [];
function matches(p, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return [p.headcode, p.uid, p.operator && p.operator.name, p.origin, p.destination,
          p.last && p.last.name, p.next && p.next.name].some(v => v && v.toLowerCase().includes(q));
}
function render() {
  const q = document.getElementById('filter').value.trim();
  const seen = new Set();
  let shown = 0;
  for (const f of latest) {
    const p = f.properties;
    if (!matches(p, q)) continue;
    const key = p.uid + '|' + p.runDate;
    seen.add(key);
    shown++;
    const ll = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
    let m = markers.get(key);
    if (!m) {
      m = L.marker(ll, { icon: icon(p), keyboard: false }).bindPopup('').addTo(map);
      m.bindTooltip(p.headcode || p.uid, { direction: 'top', offset: [0, -8] });
      markers.set(key, m);
    } else {
      m.setLatLng(ll).setIcon(icon(p));
    }
    m.getPopup().setContent(popup(p));
  }
  for (const [key, m] of markers) {
    if (!seen.has(key)) { m.remove(); markers.delete(key); }
  }
  return shown;
}

async function refresh() {
  const status = document.getElementById('status');
  try {
    const all = document.getElementById('all').checked ? '?all=true' : '';
    const res = await fetch('/v1/map/trains' + all);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    latest = data.features;
    const shown = render();
    const live = latest.filter(f => f.properties.live).length;
    const time = new Date(data.generatedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    status.textContent = `${shown} trains shown · ${live} reporting live · updated ${time}`;
  } catch (e) {
    status.textContent = 'Could not load train positions; retrying…';
  }
}

// Stations appear once zoomed in far enough to read them.
const stations = L.layerGroup();
fetch('/v1/map/stations').then(r => r.json()).then(data => {
  for (const f of data.features) {
    const [lon, lat] = f.geometry.coordinates;
    L.circleMarker([lat, lon], { radius: 3, weight: 1, color: '#555', fillColor: '#fff', fillOpacity: 1 })
      .bindTooltip(`${f.properties.name} (${f.properties.crs})`).addTo(stations);
  }
  const toggle = () => map.getZoom() >= 10 ? stations.addTo(map) : stations.remove();
  map.on('zoomend', toggle); toggle();
});

map.on('zoomend', () => {
  for (const f of latest) {
    const m = markers.get(f.properties.uid + '|' + f.properties.runDate);
    if (m) m.setIcon(icon(f.properties));
  }
});
document.getElementById('filter').addEventListener('input', render);
document.getElementById('all').addEventListener('change', refresh);
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
